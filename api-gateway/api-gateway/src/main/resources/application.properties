spring.application.name=api-gateway
server.port=8765

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true


logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=currency-exchange
spring.cloud.gateway.server.webflux.routes[0].uri=lb://currency-exchange
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/currency-exchange/**

spring.cloud.gateway.server.webflux.routes[1].id=currency-conversion
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CURRENCY-CONVERSION
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/currency-conversion/*

